# Pasang & deploy aplikasi WIZ Poso ke Cloudflare secara otomatis.
# - Setiap ada perubahan di branch main, aplikasi dikirim ulang ke Cloudflare Workers.
# - Memperbarui aplikasi: unggah WIZ_Poso_Platform.zip versi baru (Add file -> Upload files).
#   Isinya dibongkar otomatis; wrangler.jsonc yang sudah berisi Database ID tidak ditimpa.
# - Butuh secret repo CLOUDFLARE_API_TOKEN (Settings -> Secrets and variables -> Actions).
name: Pasang & deploy aplikasi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Bongkar zip (bila ada)
        run: |
          if [ ! -f WIZ_Poso_Platform.zip ]; then echo "Tidak ada zip baru"; exit 0; fi
          mkdir -p /tmp/baru && unzip -q -o WIZ_Poso_Platform.zip -d /tmp/baru
          if [ -f wrangler.jsonc ]; then rm -f /tmp/baru/wrangler.jsonc; fi
          rm -rf /tmp/baru/.github
          cp -a /tmp/baru/. .
          rm -f WIZ_Poso_Platform.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pasang isi WIZ_Poso_Platform.zip" && git push || echo "Tidak ada perubahan"
      - name: Deploy ke Cloudflare Workers
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 97855797ee8daa2ce2531968b290afb6
          wranglerVersion: "4"
      - name: Pengingat token
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "::warning::Secret CLOUDFLARE_API_TOKEN belum diisi, jadi aplikasi belum dikirim ke Cloudflare."
