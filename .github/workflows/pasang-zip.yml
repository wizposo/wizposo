# Membongkar WIZ_Poso_Platform.zip menjadi isi repositori.
# Cara memperbarui aplikasi: unggah zip versi baru dengan nama yang sama (Add file -> Upload files),
# lalu tunggu sekitar 1 menit. wrangler.jsonc yang sudah berisi Database ID tidak ditimpa.
name: Pasang zip aplikasi
on:
  push:
    paths:
      - "WIZ_Poso_Platform.zip"
      - ".github/workflows/pasang-zip.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pasang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bongkar zip
        run: |
          if [ ! -f WIZ_Poso_Platform.zip ]; then echo "Tidak ada zip"; exit 0; fi
          mkdir -p /tmp/baru && unzip -q -o WIZ_Poso_Platform.zip -d /tmp/baru
          if [ -f wrangler.jsonc ]; then rm -f /tmp/baru/wrangler.jsonc; fi
          rm -rf /tmp/baru/.github
          cp -a /tmp/baru/. .
          rm -f WIZ_Poso_Platform.zip
      - name: Simpan ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pasang isi WIZ_Poso_Platform.zip" || { echo "Tidak ada perubahan"; exit 0; }
          git push
